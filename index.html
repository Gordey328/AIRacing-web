<script>
const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4771464,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
config.canvasResizePolicy=0;
config.ensureCrossOriginIsolationHeaders=false;
config.canvas=document.getElementById('canvas');
const engine=new Engine(config),canvas=config.canvas,notice=document.getElementById('notice'),progress=document.getElementById('progress');
let started=false;
function resize(){
 const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5);
 // Cap only pixel density, never simulation frequency or opponent count.
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 const cs=getComputedStyle(document.getElementById('insets'));
 window.crossfireSafeInsets=[parseFloat(cs.paddingTop)/h,parseFloat(cs.paddingRight)/w,parseFloat(cs.paddingBottom)/h,parseFloat(cs.paddingLeft)/w];
}
resize();window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function suspend(){if(typeof window.crossfireFocusLost==='function')window.crossfireFocusLost()}
window.addEventListener('blur',suspend);window.addEventListener('pagehide',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend()});canvas.addEventListener('touchcancel',suspend);canvas.addEventListener('pointercancel',suspend);
// Reconcile an empty physical contact list even if an earlier per-finger end
// was lost. Do not pause an ordinary release or affect another held finger.
window.addEventListener('touchend',event=>{if(event.touches.length===0&&typeof window.crossfireTouchesEnded==='function')window.crossfireTouchesEnded()});

async function start(fullscreen){
 if(started)return;started=true;
 document.getElementById('play').disabled=true;document.getElementById('fullscreen').disabled=true;
 if(fullscreen&&document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}
 const missing=Engine.getMissingFeatures({threads:false});
 if(!('DecompressionStream' in window))missing.push('DecompressionStream (обновите браузер)');
 if(missing.length){notice.textContent='Браузеру не хватает: '+missing.join(', ');return;}
 notice.textContent='Загружаем игру…';progress.style.display='block';
 try{
  await engine.startGame({onProgress:(current,total)=>{if(total){progress.max=total;progress.value=current;}},onPrint:(text)=>console.log(text),onPrintError:(text)=>console.error(text)});
  document.getElementById('launch').remove();canvas.focus();resize();
 }catch(error){notice.textContent='Не удалось запустить игру: '+error.message+' Попробуй обновить страницу или открыть ссылку в другом браузере.';console.error(error);}
}
document.getElementById('play').addEventListener('click',()=>start(false));document.getElementById('fullscreen').addEventListener('click',()=>start(true));
</script>
<script>
/* Numeric entry uses a real browser input, so mobile keyboards and selection
 * remain native. Godot revalidates every submitted string with the same schema. */
(()=>{
 'use strict';
 const overlay=document.getElementById('tuning-number'),field=document.getElementById('tuning-number-value');
 const status=document.getElementById('tuning-number-status'),form=document.getElementById('tuning-number-form');
 const cancel=document.getElementById('tuning-number-cancel'),sign=document.getElementById('tuning-number-sign');
 const apply=document.getElementById('tuning-number-apply'),historyKey='crossfireNumericSheet',held=new Set();
 let active=null,serial=0,returning=false,queued=null;
 const report=(message,error=false)=>{status.textContent=message;status.dataset.error=String(error);field.setAttribute('aria-invalid',String(error));};
 const position=()=>{const v=window.visualViewport;if(v)Object.assign(overlay.style,{top:v.offsetTop+'px',left:v.offsetLeft+'px',width:v.width+'px',height:v.height+'px'});};
 const restore=(name,value)=>value===null?canvas.removeAttribute(name):canvas.setAttribute(name,value);
 function close(commit=false,back=true){
  if(!active)return;
  const old=active,text=field.value;
  if(commit&&typeof window.crossfireTuningNumberResult!=='function'){report('Игра пока не готова принять число. Повтори позже',true);return;}
  try{if(typeof window.crossfireTuningNumberResult==='function')window.crossfireTuningNumberResult(old.request.key,text,commit);}catch(_){if(commit){report('Не удалось передать число игре. Ввод сохранён',true);return;}}
  active=null;overlay.hidden=true;
  document.documentElement.classList.remove('number-open');document.body.classList.remove('number-open');
  restore('inert',old.inert);restore('tabindex',old.tabindex);restore('aria-hidden',old.ariaHidden);
  suspend();canvas.focus({preventScroll:true});
  if(back&&history.state&&history.state[historyKey]===old.token){returning=true;try{history.back();}catch(_){returning=false;history.replaceState(old.history,'');}}
 }
 function valid(){
  if(!active)return false;
  const text=field.value.trim().replace(',','.');
  if(text.length>64||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(text)){report('Введите число, например 1,25 или 1e3. NaN и бесконечность недопустимы',true);return false;}
  let value=Number(text)/active.request.factor;
  if(active.request.factor!==1){const noise=4*Number.EPSILON*Math.max(1,Math.abs(Number(text)));
   if(Math.abs(Number(text)-active.request.min*active.request.factor)<=noise)value=active.request.min;
   if(Math.abs(Number(text)-active.request.max*active.request.factor)<=noise)value=active.request.max;
  }
  if(!Number.isFinite(value)){report('Требуется конечное число',true);return false;}
  if(value<active.request.min||value>active.request.max){report('Значение за пределами модели. '+active.request.range,true);return false;}
  report('Число будет сохранено в черновик без округления к шагу ползунка');return true;
 }
 window.crossfireTuningNumber=request=>{
  if(!request||typeof request.key!=='string'||typeof request.value!=='string'||!Number.isFinite(request.min)||!Number.isFinite(request.max)||!(request.factor>0))return false;
  if(returning){queued=request;return true;}
  if(active)close(false,false);
  if(!document.getElementById('tuning-transfer').hidden)return false;
  active={request,token:++serial,history:history.state,inert:canvas.getAttribute('inert'),tabindex:canvas.getAttribute('tabindex'),ariaHidden:canvas.getAttribute('aria-hidden')};
  document.getElementById('tuning-number-title').textContent=request.title;
  document.getElementById('tuning-number-help').textContent=request.hint+'. '+request.range+'. Диапазон ползунка — подсказка; ручной ввод может выходить за него.';
  document.getElementById('tuning-number-label').textContent='Точное значение'+(request.unit?' ('+request.unit+')':'');
  field.value=request.value;sign.hidden=!request.signed;report('Нажми на число, чтобы открыть клавиатуру. Enter — готово, Escape — отмена');
  overlay.hidden=false;document.documentElement.classList.add('number-open');document.body.classList.add('number-open');
  suspend();canvas.setAttribute('inert','');canvas.setAttribute('tabindex','-1');canvas.setAttribute('aria-hidden','true');
  try{history.pushState({...history.state,[historyKey]:active.token},'');}catch(_){}
  position();field.focus({preventScroll:true});field.select();return true;
 };
 form.addEventListener('submit',event=>{event.preventDefault();if(valid())close(true);else field.focus();});
 field.addEventListener('input',()=>{valid();});
 cancel.addEventListener('click',()=>close());
 sign.addEventListener('click',()=>{field.value=field.value.startsWith('-')?field.value.slice(1):'-'+field.value.replace(/^\+/,'');field.focus();valid();});
 overlay.addEventListener('keyup',event=>event.stopPropagation());
 document.addEventListener('focusin',event=>{if(active&&!overlay.contains(event.target))field.focus({preventScroll:true});});
 overlay.addEventListener('keydown',event=>{
  event.stopPropagation();
  if(event.key==='Escape'){event.preventDefault();event.stopPropagation();close();}
  if(event.key==='Tab'){
   const controls=[field,...(sign.hidden?[]:[sign]),cancel,apply];const i=controls.indexOf(document.activeElement);
   if((event.shiftKey&&i<=0)||(!event.shiftKey&&i===controls.length-1)){event.preventDefault();controls[event.shiftKey?controls.length-1:0].focus();}
  }
 });
 // Neither typing WASD nor the closing Enter/Escape keyup can reach the race.
 for(const type of ['keydown','keyup'])window.addEventListener(type,event=>{
  const key=event.code||event.key;
  if(active){if(type==='keydown')held.add(key);else held.delete(key);if(!overlay.contains(event.target)){event.preventDefault();event.stopImmediatePropagation();}}
  else if(type==='keyup'&&held.delete(key)){event.preventDefault();event.stopImmediatePropagation();}
 },true);
 for(const type of ['pointerdown','pointerup','touchstart','touchend','touchcancel','mousedown','mouseup','wheel'])overlay.addEventListener(type,event=>event.stopPropagation());
 window.addEventListener('popstate',()=>{
  if(active&&(!history.state||history.state[historyKey]!==active.token))close(false,false);
  if(!active&&history.state&&history.state[historyKey]){const state={...history.state};delete state[historyKey];history.replaceState(state,'');}
  returning=false;if(queued){const request=queued;queued=null;window.crossfireTuningNumber(request);}
 });
 if(window.visualViewport){window.visualViewport.addEventListener('resize',position);window.visualViewport.addEventListener('scroll',position);}
 window.addEventListener('resize',position);
})();
</script>
<script>
/* Browser-local bridge for Godot: crossfireTuningTransfer(text, 'export'|'import').
 * Import calls crossfireTuningImportResult(text); Godot owns schema validation,
 * applying values atomically, and keeping its tuning/pause menu open. */
(()=>{
 'use strict';
 const maxBytes=64*1024,historyKey='crossfireTuningSheet';
 const overlay=document.getElementById('tuning-transfer'),sheet=overlay.querySelector('.tuning-sheet');
 const field=document.getElementById('tuning-json'),fileInput=document.getElementById('tuning-file');
 const status=document.getElementById('tuning-status'),closeButton=document.getElementById('tuning-close');
 const applyButton=document.getElementById('tuning-apply'),shareButton=document.getElementById('tuning-share');
 const heldKeys=new Set();
 let active=null,serial=0,fileSerial=0,returningHistory=false,queuedOpen=null;
 const bytes=text=>new Blob([text]).size;
 function report(message,error=false){status.textContent=message;status.dataset.error=String(error);}
 function selectText(){field.focus({preventScroll:true});field.select();field.setSelectionRange(0,field.value.length);}
 function positionSheet(){
  const viewport=window.visualViewport;
  if(viewport){Object.assign(overlay.style,{top:viewport.offsetTop+'px',left:viewport.offsetLeft+'px',width:viewport.width+'px',height:viewport.height+'px'});}
 }
 function restoreAttribute(node,name,value){if(value===null)node.removeAttribute(name);else node.setAttribute(name,value);}
 function closeSheet(traverseHistory=true){
  if(!active)return;
  const previous=active;active=null;fileSerial++;
  overlay.hidden=true;document.documentElement.classList.remove('tuning-open');document.body.classList.remove('tuning-open');
  restoreAttribute(canvas,'tabindex',previous.tabindex);restoreAttribute(canvas,'aria-hidden',previous.ariaHidden);restoreAttribute(canvas,'inert',previous.inert);
  field.value='';fileInput.value='';
  // Releasing input is deliberately separate from the game's resume command.
  suspend();canvas.focus({preventScroll:true});
  if(traverseHistory&&previous.historyToken&&history.state&&history.state[historyKey]===previous.historyToken){
   returningHistory=true;
   try{history.back();}catch(_){returningHistory=false;history.replaceState(previous.historyState,'');}
  }
 }
 function configure(text,mode){
  active.generation=++serial;active.mode=mode;fileSerial++;
  const importing=mode==='import';
  document.getElementById('tuning-title').textContent=importing?'Импорт настроек':'Экспорт настроек';
  document.getElementById('tuning-help').textContent=importing?'Выбери JSON-файл или вставь текст. Игра проверит настройки перед применением. Файл остаётся на устройстве.':'Сохрани JSON или скопируй текст. Если браузер ограничивает доступ, выдели текст и скопируй его вручную.';
  document.getElementById('tuning-file-wrap').hidden=!importing;
  document.getElementById('tuning-export-actions').hidden=importing;
  document.getElementById('tuning-import-actions').hidden=!importing;
  shareButton.hidden=importing||typeof navigator.share!=='function';
  field.readOnly=!importing;field.value=text;fileInput.value='';applyButton.disabled=false;
  report(importing?'Лимит: 64 КиБ. Закрытие окна ничего не меняет.':'Обмен происходит только по выбранному тобой действию.');
  if(bytes(text)>maxBytes)report('Размер превышает 64 КиБ. Выбери меньший файл или сократи текст.',true);

 window.crossfireTuningTransfer=function(text,mode){
  if(mode!=='export'&&mode!=='import')return false;
  text=typeof text==='string'?text:'';
  if(returningHistory){queuedOpen={text,mode};return true;}
  if(!active){
   active={tabindex:canvas.getAttribute('tabindex'),ariaHidden:canvas.getAttribute('aria-hidden'),inert:canvas.getAttribute('inert'),historyState:history.state,historyToken:null};
   suspend();canvas.blur();canvas.setAttribute('inert','');canvas.setAttribute('aria-hidden','true');canvas.setAttribute('tabindex','-1');
   overlay.hidden=false;document.documentElement.classList.add('tuning-open');document.body.classList.add('tuning-open');
   const token='tuning-'+Date.now()+'-'+(++serial);
   try{history.pushState({[historyKey]:token},'');active.historyToken=token;}catch(_){/* Embedded browsers can disallow History; Close and Escape still work. */}
  }

 };

 window.addEventListener('popstate',()=>{
  if(active&&(!history.state||history.state[historyKey]!==active.historyToken))closeSheet(false);
  returningHistory=false;
  if(queuedOpen){const next=queuedOpen;queuedOpen=null;window.crossfireTuningTransfer(next.text,next.mode);}
 });

 // document/window listeners. Canvas is inert for the entire modal lifetime.

  overlay.addEventListener(type,event=>event.stopPropagation(),{passive:true});
 });

  if(!active)return;
  heldKeys.add(event.code||event.key);
  if(!overlay.contains(event.target)){event.preventDefault();event.stopImmediatePropagation();closeButton.focus({preventScroll:true});}
 },true);

  const held=heldKeys.delete(event.code||event.key);
  if(held&&(!active||!overlay.contains(event.target))){event.preventDefault();event.stopImmediatePropagation();}
 },true);

  event.stopPropagation();
  if(event.key==='Escape'){event.preventDefault();closeSheet();return;}
  if(event.key==='Tab'){
   const focusable=Array.from(sheet.querySelectorAll('button,input,textarea')).filter(node=>!node.disabled&&node.getClientRects().length);
   const first=focusable[0],last=focusable[focusable.length-1];
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
 });
 overlay.addEventListener('keyup',event=>event.stopPropagation());
 document.addEventListener('focusin',event=>{if(active&&!overlay.contains(event.target))closeButton.focus({preventScroll:true});});
 window.addEventListener('resize',positionSheet);
 if(window.visualViewport){window.visualViewport.addEventListener('resize',positionSheet);window.visualViewport.addEventListener('scroll',positionSheet);}
 field.addEventListener('input',()=>{
  if(active&&active.mode==='import'){
   fileSerial++;applyButton.disabled=false;
   report(bytes(field.value)>maxBytes?'Размер превышает 64 КиБ. Сократи текст перед применением.':'JSON будет проверен игрой перед применением.',bytes(field.value)>maxBytes);
  }
 });
 fileInput.addEventListener('change',()=>{
  const file=fileInput.files&&fileInput.files[0];if(!active||active.mode!=='import'||!file)return;
  const generation=active.generation,readSerial=++fileSerial;
  if(file.size>maxBytes){applyButton.disabled=false;report('Файл больше 64 КиБ. Выбери меньший JSON-файл.',true);fileInput.value='';return;}
  report('Читаем файл…');applyButton.disabled=true;
  const reader=new FileReader();
  reader.onload=()=>{
   if(!active||active.generation!==generation||fileSerial!==readSerial)return;
   applyButton.disabled=false;
   const text=typeof reader.result==='string'?reader.result:'';
   if(bytes(text)>maxBytes){report('Текст файла превышает 64 КиБ.',true);return;}
   field.value=text;report('Файл открыт. Нажми «Применить JSON», чтобы проверить и применить настройки.');
  };
  reader.onerror=reader.onabort=()=>{if(active&&active.generation===generation&&fileSerial===readSerial){applyButton.disabled=false;report('Не удалось прочитать файл. Попробуй ещё раз или вставь JSON вручную.',true);}};
  try{reader.readAsText(file);}catch(_){reader.onerror();}
 });
 applyButton.addEventListener('click',()=>{
  if(!active||active.mode!=='import'||applyButton.disabled)return;
  const text=field.value;
  if(bytes(text)>maxBytes){report('Размер превышает 64 КиБ. Настройки не отправлены в игру.',true);return;}
  if(!text.trim()){report('Выбери JSON-файл или вставь текст настроек.',true);return;}
  if(typeof window.crossfireTuningImportResult!=='function'){report('Игра пока не готова принять настройки. Закрой окно и попробуй ещё раз.',true);return;}
  applyButton.disabled=true;
  try{window.crossfireTuningImportResult(text);closeSheet();}
  catch(_){applyButton.disabled=false;report('Не удалось передать настройки игре. Текст сохранён здесь; попробуй ещё раз.',true);}
 });
 document.getElementById('tuning-copy').addEventListener('click',async()=>{
  if(!active||active.mode!=='export')return;
  const generation=active.generation,text=field.value;
  selectText();
  try{
   if(!navigator.clipboard||typeof navigator.clipboard.writeText!=='function')throw new Error('Clipboard unavailable');
   await navigator.clipboard.writeText(text);
   if(active&&active.generation===generation)report('JSON скопирован в буфер обмена.');
  }catch(_){if(active&&active.generation===generation){selectText();report('Браузер не разрешил копирование. Текст выделен: нажми и удерживай его, затем выбери «Скопировать».',true);}}
 });
 document.getElementById('tuning-download').addEventListener('click',()=>{
  if(!active||active.mode!=='export')return;
  let url=null;
  try{
   url=URL.createObjectURL(new Blob([field.value],{type:'application/json;charset=utf-8'}));
   const link=document.createElement('a');link.href=url;link.download='crossfire-tuning.json';link.hidden=true;sheet.appendChild(link);link.click();link.remove();
   // Safari can need the Blob after the click's task has finished.
   setTimeout(()=>URL.revokeObjectURL(url),60000);
   report('Запрос на скачивание отправлен браузеру. Если файл не появился, скопируй JSON или выбери «Поделиться».');
  }catch(_){if(url)URL.revokeObjectURL(url);selectText();report('Не удалось начать скачивание. Текст выделен для ручного копирования.',true);}
 });
 shareButton.addEventListener('click',async()=>{
  if(!active||active.mode!=='export'||typeof navigator.share!=='function')return;
  const generation=active.generation,text=field.value;
  try{
   let payload={title:'Crossfire: настройки машины',text};
   if(typeof File==='function'&&typeof navigator.canShare==='function'){
    const file=new File([text],'crossfire-tuning.json',{type:'application/json'});
    if(navigator.canShare({files:[file]}))payload={title:payload.title,files:[file]};
   }
   await navigator.share(payload);
   if(active&&active.generation===generation)report('Действие в меню «Поделиться» завершено.');
  }catch(error){if(active&&active.generation===generation){if(error&&error.name==='AbortError')report('Обмен отменён. JSON остаётся доступен здесь.');else{selectText();report('Не удалось открыть обмен. Текст выделен для ручного копирования.',true);}}}
 });
})();
</script>
</body></html>
